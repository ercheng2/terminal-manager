name: Build Terminal Manager

on:
  push:
    branches: [master, main]

jobs:
  build-client:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client dependencies
        run: |
          cd client
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build client exe
        run: |
          cd client
          pyinstaller --name "TerminalManager-Client" --onefile --windowed --icon=icon.ico --add-data "icon.ico;." --hidden-import pystray --hidden-import PIL --hidden-import psutil --hidden-import urllib --hidden-import mss --hidden-import pyautogui --hidden-import python_xlib --clean main.py
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminalManager-client
          path: client/dist/TerminalManager-Client.exe

  build-server:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build server exe
        run: |
          cd server
          pyinstaller --name "TerminalManager-Server" --onefile --windowed --icon=icon.ico --add-data "icon.ico;." --add-data "static;static" --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on --hidden-import pystray --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageDraw --hidden-import PIL.ImageTk --hidden-import PIL.ImageIO --hidden-import io --hidden-import windnd --hidden-import pynput --hidden-import pynput.keyboard --hidden-import pynput.keyboard._win32 --clean main.py
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminalManager-server
          path: server/dist/TerminalManager-Server.exe

  build-keygen:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyinstaller
        run: pip install pyinstaller==6.11.1
      - name: Build keygen exe
        run: |
          cd keygen
          pyinstaller --name "KZC-KeyGen" --onefile --windowed --hidden-import=tkinter --hidden-import=tkinter.messagebox --hidden-import=hashlib --noupx --clean keygen.py
      - name: Upload keygen artifact
        uses: actions/upload-artifact@v4
        with:
          name: KZC-KeyGen
          path: keygen/dist/KZC-KeyGen.exe

  release:
    needs: [build-client, build-server, build-keygen]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TerminalManager-client
          path: ./release/
      - uses: actions/download-artifact@v4
        with:
          name: TerminalManager-server
          path: ./release/
      - uses: actions/download-artifact@v4
        with:
          name: KZC-KeyGen
          path: ./release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          files: |
            release/TerminalManager-Client.exe
            release/TerminalManager-Server.exe
            release/KZC-KeyGen.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
