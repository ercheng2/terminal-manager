name: Build Terminal Manager

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd client
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          cd client
          pyinstaller --name "TerminalManager" --onefile --hidden-import pycaw --hidden-import comtypes --hidden-import websockets --hidden-import pystray --hidden-import PIL --hidden-import psutil --clean main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminalManager-exe
          path: client/dist/TerminalManager.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          files: client/dist/TerminalManager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
